name: Monitor YouTube handle

on:
  workflow_dispatch:
  schedule:
    
cron: "0,30 * * * *"

permissions:
  contents: write

jobs:
  check-handle:
    runs-on: ubuntu-latest
    steps:
      
name: Get repository files
      uses: actions/checkout@v4

      
name: Check @a2u
      env:
        DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      run: python monitor.py

      
name: Save latest status
      run: |
        if [[ -n "$(git status --porcelain monitor_state.txt)" ]]; then
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add monitor_state.txt
          git commit -m "Update handle monitor status"
          git push
        fi
