
name: Monitor YouTube handle

"on":
  workflow_dispatch:
  schedule:
    - cron: "0,30 * * * *"

permissions:
  contents: read

jobs:
  check-handle:
    runs-on: ubuntu-latest
    steps:
      - name: Get repository files
        uses: actions/checkout@v4

      - name: Restore previous check state
        uses: actions/cache@v4
        with:
          path: monitor_state.txt
          key: handle-state-${{ github.run_id }}
          restore-keys: |
            handle-state-

      - name: Check YouTube handle
        run: python monitor.py
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_USER_ID: ${{ secrets.DISCORD_USER_ID }}
