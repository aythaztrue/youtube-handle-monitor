
name: Monitor YouTube handle

"on":
  workflow_dispatch:
  schedule:
    - cron: "0,30 * * * *"

permissions:
  contents: read

jobs:
  check-handle:
    runs-on: ubuntu-latest
    steps:
      - name: Get repository files
        uses: actions/checkout@v4

      - name: Check YouTube handle
        run: python monitor.py
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
